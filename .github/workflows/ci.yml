name: CI

# Runs the three checks that already pass locally, so they keep passing. Until now nothing enforced
# them: typecheck, lint and 250 tests were green by habit, not by gate.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # prisma.config.ts calls checkEnv("DIRECT_URL") at module load, so EVERY prisma CLI command
      # needs it present — including `generate` and `validate`, neither of which opens a connection.
      # These are deliberately unreachable dummies: CI must never hold a credential for the
      # production database, and no step here talks to one.
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than read from a `packageManager` field: adding that field would also pin the
      # version Vercel builds with, which is a deploy-behaviour change this workflow shouldn't make.
      # Keep in step with the pnpm used locally.
      #
      # v6, not v4: v4 runs on node20, which GitHub deprecated — every run was being force-migrated to
      # node24 with a warning, and would break outright once they stop forcing it. v6 targets node24
      # natively and still takes `version`.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema sanity before anything depends on it. Does not connect to a database.
      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      # generated/prisma is gitignored, so this must run before typecheck — tsc resolves the client
      # types from it. Codegen only; no database access.
      - name: Generate Prisma client
        run: pnpm db:generate

      # `pnpm typecheck` runs `next typegen` first. Next generates the global LayoutProps/PageProps
      # types and the image-module declarations into .next/types and next-env.d.ts, both gitignored —
      # so on a clean checkout tsc cannot see them and fails on app/ files that are perfectly valid.
      # Locally it passed only because a previous `next dev` had left them behind.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Do the migrations in prisma/migrations/ actually produce prisma/schema.prisma?
  #
  # This is the check that would have caught the CronRun migration sitting committed-but-unapplied, and
  # the more common mistake it guards is editing schema.prisma without writing the matching migration —
  # easy to do here, because migrations are applied by hand against production and never by the app.
  #
  # It needs a real Postgres because `--from-migrations` replays every migration to compute the schema
  # they produce. The service container below is disposable and exists only for that; no production
  # credential is involved.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      # `migrate diff --from-migrations` WRITES here, so it must be a throwaway. Never point this at
      # anything real — see the note in prisma.config.ts.
      SHADOW_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/shadow

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A vanilla Postgres is not Supabase. The migrations reference one Supabase-managed role —
      # `GRANT EXECUTE ON FUNCTION public.due_clients() TO service_role` — which does not exist here, so
      # replaying them fails with P3006 / "role service_role does not exist". Roles are cluster-wide, so
      # creating it once covers the shadow database too. Bare and unprivileged: it exists only so the
      # GRANT resolves, and nothing connects as it.
      #
      # Anything else Supabase-managed (the trigger on auth.users that creates Client rows) lives in
      # Supabase and not in prisma/migrations, so it is not replayed and needs nothing here.
      - name: Prepare the shadow database
        run: |
          psql "$DIRECT_URL" -c "CREATE ROLE service_role;"
          psql "$DIRECT_URL" -c "CREATE DATABASE shadow;"

      # --exit-code makes an empty diff exit 0 and a non-empty diff exit 2, so drift fails the job.
      - name: Migrations must reproduce schema.prisma
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
